name: Sync Leetcode

on:
  workflow_dispatch: # Allows you to trigger it manually anytime
  schedule:
    - cron: "0 8 * * 6" # Automatically checks for new updates every Saturday at 8:00 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Submissions
        uses: joshcai/leetcode-sync@v1.6
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: "solutions" # Saves your files inside a folder named "solutions"
          verbose: true
